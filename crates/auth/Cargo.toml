[package]
name = "auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# Pure-crypto primitives layer (Argon2id, token/CSRF hashing). No `db` yet —
# session/token persistence wires in with the repository layer — so this builds
# without a C toolchain.
argon2 = { workspace = true }
getrandom = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
subtle = { workspace = true }
# AES-256-GCM for encrypting stored OAuth refresh tokens (GSC). `ring` is already
# in the lock tree (via rustls), so this adds only a direct edge, no new crates.
ring = "0.17"
