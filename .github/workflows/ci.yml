name: CI

# The real gate (docs/13-roadmap.md). Runs on every push and PR.
on:
  push:
    branches: [main, master]
    tags: ["v*"]          # a version tag also triggers the full release build
  pull_request:
  workflow_dispatch:      # allow the release build to be run on demand

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No query! macros exist against a live DB in CI; build offline. The
  # migrations job below verifies the schema separately against real Postgres.
  SQLX_OFFLINE: "true"

jobs:
  # ── Schema smoke test — no Rust toolchain, always runs (tools/schema-check) ──
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migrations into PGlite and assert design invariants
        working-directory: tools/schema-check
        run: |
          npm install --no-audit --no-fund
          node verify.mjs

  # ── Rust: format, lint, test, build ─────────────────────────────────────────
  rust:
    runs-on: ubuntu-latest
    # A Postgres service so the workspace's DB integration tests actually run
    # (crates/db/tests/connection.rs skips itself when DATABASE_URL is unset).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: backlio
          POSTGRES_PASSWORD: backlio
          POSTGRES_DB: backlio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backlio -d backlio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://backlio:backlio@localhost:5432/backlio
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      # Fail fast if Cargo.lock is out of sync with the manifests. The Dockerfile
      # (Render deploy) builds with `cargo build --release --locked`, which
      # refuses a stale lock — so catch that here instead of at deploy time.
      - name: Verify Cargo.lock is in sync
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      # Debug build of all bin/test targets — catches compile errors fast on
      # every push. The full LTO release build is verified separately by the
      # `release-build` job (tags / manual only), so PR feedback stays quick.
      - name: cargo build (all targets, debug)
        run: cargo build --workspace --all-targets --locked
      - name: No format!-built SQL (S9 guard, docs/11)
        run: |
          if grep -rnE 'query(_as)?\(&?format!' crates apps --include='*.rs'; then
            echo "::error::Dynamic SQL via format! is forbidden (docs/11 S9). Use parameters."
            exit 1
          fi

  # ── Migrations against real Postgres (docs/10 §4, docs/adr/0005) ────────────
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: backlio
          POSTGRES_PASSWORD: backlio
          POSTGRES_DB: backlio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backlio -d backlio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Migrations use the DIRECT connection, never a pooler (docs/adr/0005).
      DATABASE_URL: postgres://backlio:backlio@localhost:5432/backlio
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version ^0.9 --no-default-features --features rustls,postgres --locked
      - name: Apply migrations from empty
        run: sqlx migrate run --source migrations
      - name: Migration state is clean
        run: sqlx migrate info --source migrations
      - name: Re-apply is a no-op (idempotent)
        run: sqlx migrate run --source migrations

  # ── Frontend — runs only once apps/web exists ───────────────────────────────
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f apps/web/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT";
          else echo "exists=false" >> "$GITHUB_OUTPUT"; echo "apps/web not present yet — skipping"; fi
      # pnpm version comes from package.json's "packageManager" field; do not
      # also pass `version` here or action-setup errors on the conflict.
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.exists == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.check.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.exists == 'true'
        run: pnpm --filter web typecheck
      # `next build` type-checks and bundles; it is the real gate for the app.
      # (ESLint config + unit tests are added in a later frontend increment.)
      - if: steps.check.outputs.exists == 'true'
        run: pnpm --filter web build

  # ── Dependency vulnerability audit (docs/11 Phase-7 checklist) ──────────────
  # Rust advisories via cargo-audit; JS advisories via pnpm audit. Catches a
  # vulnerable transitive dep (e.g. a Next.js CVE) automatically on every push.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rust: RustSec advisory DB against Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
      # JS: pnpm workspace audit, high severity and up. Patched transitive
      # versions are pinned via `pnpm.overrides` in the root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high+)
        run: pnpm audit --audit-level high

  # ── Full LTO release build — the actual shipping profile ────────────────────
  # Slow (LTO + codegen-units=1), so it does NOT run on every push. It runs on
  # version tags (v*) and on manual dispatch, which is when the shipping binary
  # actually matters. Everyday pushes get the fast debug build in the `rust` job.
  release-build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --workspace --release --locked
