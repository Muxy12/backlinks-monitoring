# Render blueprint for the Backlio API (docs/17). Free plan, Docker build from
# the repo Dockerfile (which builds the `server` binary; the CMD runs it).
#
# There is no always-on worker on the free tier — monitoring is driven by the
# `/internal/tick` endpoint, called on a schedule by
# `.github/workflows/monitor-tick.yml` (which also keeps this service awake).
#
# Secrets are marked `sync: false`: set their values in the Render dashboard,
# never in the repo. Map the Neon URLs correctly:
#   DATABASE_URL         = Neon POOLED  (…-pooler…)   — the API's normal queries
#   DATABASE_DIRECT_URL  = Neon DIRECT  (no -pooler)  — migrations / advisory work
services:
  - type: web
    name: backlio-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: RUST_LOG
        value: info
      - key: DB_MAX_CONNECTIONS
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_TTL_HOURS
        value: "720"
      - key: SCHEDULER_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_AGENCY
        sync: false
      - key: STRIPE_PRICE_AGENCY_PLUS
        sync: false
      - key: EMAIL_PROVIDER_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
