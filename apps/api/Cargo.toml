[package]
name = "api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
tokio = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
tower = { workspace = true, features = ["util"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
common = { workspace = true }
backlio-core = { workspace = true }
reqwest = { workspace = true }
billing = { workspace = true }
notifications = { workspace = true }
db = { workspace = true }
auth = { workspace = true }
jobs = { workspace = true }
crawler = { workspace = true }
# The API drives monitoring on the free/cron model (docs/17): /internal/tick
# runs the worker's schedule + process + warranty sweep in-process.
worker = { path = "../worker" }

[dev-dependencies]
http-body-util = "0.1"
hmac = { workspace = true }
sha2 = { workspace = true }
wiremock = "0.6"
